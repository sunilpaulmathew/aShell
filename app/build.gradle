plugins {
    alias(libs.plugins.androidApplication)
}

android {
    signingConfigs {
        release {
            def keystoreFile = file("signing_cert.p12")
            if (keystoreFile.exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                storeFile keystoreFile
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    namespace 'in.sunilpaulmathew.ashell'
    compileSdkVersion 37

    defaultConfig {
        applicationId "in.sunilpaulmathew.ashell"
        minSdk 24
        targetSdk 37
        versionCode 32
        versionName "v0.32"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("signing_cert.p12").exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
        aidl true
    }
}

dependencies {
    implementation libs.material
    implementation libs.preference
    implementation libs.shizukuApi
    implementation libs.shizukuProvider
}